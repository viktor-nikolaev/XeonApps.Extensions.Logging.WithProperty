name: Publish to NuGet

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matching tag on master history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 eng/verify-package.py --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master

  verify:
    needs: validate-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish the tested artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Recheck artifact identity before requesting credentials
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo 'Set the NUGET_USER variable to the owning nuget.org profile name.'; exit 1; }
          python3 eng/verify-package.py artifacts/packages --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG"
      - name: Obtain a short-lived NuGet publishing key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push package and its matching symbol package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
